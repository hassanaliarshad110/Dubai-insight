name: Website

# Builds the site from the latest data after every data refresh. It only goes live once the
# repository variable PUBLISH_SITE is set to "true" (Settings > Secrets and variables > Actions > Variables)
# and GitHub Pages is set to deploy from GitHub Actions.
on:
  workflow_run:
    workflows: ['Refresh data']
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'pipeline/build.py', 'pipeline/lawlib.py', 'pipeline/aiexport.py', 'data/official.json', 'data/guide/**', 'data/laws/**', '.github/workflows/site.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python pipeline/build.py
        env:
          CONNECTOR_URL: ${{ vars.CONNECTOR_URL || 'https://dubai-insight-mcp.hasssanaliarshad.workers.dev' }}
      - name: Check the site's data
        run: |
          test -s site/data/official.json
          if [ -s site/data/realestate.json ]; then echo "property data ready"; else echo "no property data yet"; fi
      - uses: actions/upload-pages-artifact@v3
        if: vars.PUBLISH_SITE == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: vars.PUBLISH_SITE == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
