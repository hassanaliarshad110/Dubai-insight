name: Refresh data

on:
  schedule:
    - cron: '17 23 * * *'     # every night, about 3:17 a.m. in Dubai
  workflow_dispatch:
    inputs:
      budget:
        description: 'Minutes to spend pulling data'
        default: '300'

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dubai Land Department (sales, mortgages, gifts and rental contracts)
        env:
          TZ: Asia/Dubai
        run: python pipeline/dld.py --budget-min ${{ github.event.inputs.budget || '150' }}
      - name: Keep the new figures
        if: always()
        run: |
          git config user.name "Hassan Ali"
          git config user.email "hassanaliarshad110@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Data refresh $(TZ=Asia/Dubai date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 10; done
