name: Refresh data

on:
  schedule:
    - cron: '17 23 * * *'     # every night, about 3:17 a.m. in Dubai
  workflow_dispatch:
    inputs:
      budget:
        description: 'Minutes to spend pulling data'
        default: '300'

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dubai Land Department (sales, mortgages, gifts and rental contracts), saved every 25 minutes
        env:
          TZ: Asia/Dubai
          BUDGET: ${{ github.event.inputs.budget || '150' }}
        run: |
          git config user.name "Hassan Ali"
          git config user.email "hassanaliarshad110@users.noreply.github.com"
          save() {
            git add data
            if git diff --cached --quiet; then echo "nothing new"; return 0; fi
            git commit -q -m "Data refresh $(TZ=Asia/Dubai date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3; do git pull --rebase -q && git push -q && return 0; sleep 10; done
          }
          end=$(( $(date +%s) + BUDGET * 60 ))
          while :; do
            left=$(( (end - $(date +%s)) / 60 ))
            [ "$left" -lt 5 ] && break
            chunk=$(( left < 25 ? left : 25 ))
            set +e; python pipeline/dld.py --budget-min "$chunk"; code=$?; set -e
            save
            [ "$code" -eq 10 ] || break
          done
